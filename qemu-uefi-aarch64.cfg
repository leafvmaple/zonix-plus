# QEMU Configuration for Zonix OS — AArch64 UEFI
#
# virtio-blk supplies the boot image to firmware; SDHCI supplies the base rootfs.
# An optional application disk is attached by Makefile with USER_DISK=...
#
# Usage: make qemu ARCH=aarch64

[machine]
type = "virt"

[memory]
size = "256M"

# virtio-blk: UEFI boot only — kernel has no virtio-blk driver, cannot see this
[drive "sys"]
file = "bin/aarch64/zonix-uefi.img"
format = "raw"
if = "none"

[device "virtio-blk0"]
driver = "virtio-blk-pci"
drive = "sys"

# SDHCI: independent base rootfs (sd0)
[drive "sdcard"]
file = "bin/aarch64/rootfs.img"
format = "raw"
if = "none"

[device "sdhci0"]
driver = "sdhci-pci"

[device "sd0"]
driver = "sd-card"
drive = "sdcard"

# Display: ramfb (provides GOP for UEFI firmware)
[device "display"]
driver = "ramfb"

# Keyboard: virtio-keyboard-pci (GUI input)
[device "keyboard"]
driver = "virtio-keyboard-pci"
