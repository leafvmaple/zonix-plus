# QEMU Configuration for Zonix OS — UEFI + AHCI (default)
#
# Boot image on AHCI port 0. The Makefile attaches the base rootfs on
# port 1 (or IDE with DISK=ide), and optional USER_DISK applications on port 2.
#
# Usage: make qemu  (or: make qemu DISK=ide)

[machine]
type = "pc"

[memory]
size = "256M"

# AHCI Controller
[device "ahci0"]
driver = "ahci"

# Port 0: system disk (GPT + ESP)
[drive "ahci-sys"]
file = "bin/x86/zonix-uefi.img"
format = "raw"
if = "none"

[device "ahci-hd0"]
driver = "ide-hd"
bus = "ahci0.0"
drive = "ahci-sys"
bootindex = "0"

# Serial console
[chardev]
backend = "stdio"
id = "char0"

[device]
driver = "isa-serial"
chardev = "char0"
