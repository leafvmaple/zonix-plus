# QEMU Configuration for Zonix OS — BIOS + IDE (fallback)
#
# Boot image on IDE. The Makefile attaches the independent base rootfs,
# plus an optional application disk selected by USER_DISK.
#
# Usage: make qemu-bios  (or: make qemu-bios DISK=ide)

[machine]
type = "pc"

[memory]
size = "128M"

[boot-opts]
order = "c"

# Primary IDE disk (hda) — main system disk
[drive]
file = "bin/x86/zonix.img"
format = "raw"
if = "ide"
index = "0"
media = "disk"

# AHCI controller for base rootfs and optional applications (attached via Makefile)
[device "ahci0"]
driver = "ahci"

# Serial console
[chardev]
backend = "stdio"
id = "char0"

[device]
driver = "isa-serial"
chardev = "char0"
